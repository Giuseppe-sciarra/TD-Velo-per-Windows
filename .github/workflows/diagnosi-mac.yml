# Temporaneo: riproduce su macOS 27 l'apertura del DMG pubblicato così come arriva a chi lo scarica (con la quarantena
# di macOS), per capire perché su alcuni Mac il programma non si apre. Si toglie a diagnosi finita.
name: Diagnosi Mac
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Rilascio da provare"
        default: v1.1.0
permissions:
  contents: read
jobs:
  prova:
    strategy:
      fail-fast: false
      matrix:
        quarantena: [si, no]
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Scarico e apro il DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sw_vers
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --dir dl
          DMG=$(ls dl/*.dmg)
          if [ "${{ matrix.quarantena }}" = si ]; then
            xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$DMG"
          fi
          xattr -l "$DMG" || true
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/tdvelo
          cp -R "/Volumes/tdvelo/TD Velo.app" /Applications/
          hdiutil detach /Volumes/tdvelo || true
          echo "--- attributi dell'app copiata"; xattr -l "/Applications/TD Velo.app" || true
          xattr -l "/Applications/TD Velo.app/Contents/MacOS/libcoreclr.dylib" || true
          echo "--- giudizio di Gatekeeper"; spctl -a -vv "/Applications/TD Velo.app" 2>&1 || true
          codesign -dv --verbose=2 "/Applications/TD Velo.app" 2>&1 | head -12 || true
      - name: Avvio dal Terminale, come ha fatto il cliente
        run: |
          cat > finestre.swift <<'S'
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments.dropFirst().first ?? "") ?? 0
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = all.filter { ($0[kCGWindowOwnerPID as String] as? Int32) == pid && ($0[kCGWindowLayer as String] as? Int) == 0 }
          print("finestre: \(mine.count)")
          exit(mine.isEmpty ? 1 : 0)
          S
          swiftc -O finestre.swift -o finestre
          "/Applications/TD Velo.app/Contents/MacOS/TDVelo" > avvio.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 20); do sleep 2; if ./finestre "$PID"; then OK=1; break; fi; kill -0 "$PID" 2>/dev/null || { echo "processo terminato"; break; }; done
          screencapture -x schermo.png || true
          echo "--- uscita del programma"; cat avvio.log || true
          if [ "$OK" = 1 ]; then echo "APERTO"; else
            echo "NON APERTO"
            if kill -0 "$PID" 2>/dev/null; then echo "--- dove è fermo"; sample "$PID" 3 -file fermo.txt >/dev/null 2>&1 || true; head -150 fermo.txt || true; fi
            echo "--- registro di sistema (Gatekeeper)"; log show --last 2m --predicate 'process == "syspolicyd" OR process == "amfid" OR eventMessage CONTAINS "TDVelo"' --style compact 2>/dev/null | tail -60 || true
          fi
          kill "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        continue-on-error: true
        with:
          name: diagnosi-quarantena-${{ matrix.quarantena }}
          path: |
            schermo.png
            fermo.txt
            avvio.log
          retention-days: 1
